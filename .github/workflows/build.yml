name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the book's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev python3-numpy python3-matplotlib
      - name: Build every chapter
        run: make all
      - name: Quick checks
        run: make check
